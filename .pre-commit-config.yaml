# Optional local hooks that catch what CI would reject, before a commit is written.
# Enable them once with:
#     pip install pre-commit
#     pip install -e '.[lint]'
#     pre-commit install
# Check the whole repository at any time with:
#     pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # The whitespace rules .editorconfig declares and the test suite enforces
      - id: trailing-whitespace
        # Two trailing spaces are a Markdown line break and LICENSE is verbatim upstream text
        exclude: '\.md$|^LICENSE$'
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        # MkDocs configuration uses Python object tags that a strict YAML parser rejects
        exclude: '^mkdocs\.yml$'
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
      # A private key must never reach a commit. The full gitleaks history scan stays in CI,
      # where it needs no Go toolchain on a contributor's machine
      - id: detect-private-key

  # Runs the ruff already installed from the [lint] extra rather than a second copy pinned here.
  # One pin in pyproject.toml is what keeps the hook and CI on the same version
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check
        args: [--no-fix]
        language: system
        files: '^(instagram_monitor\.py|tests/.*\.py)$'
