name: Publish to PyPI

on:
  release:
    types: [published]

permissions: {}

jobs:
  test:
    name: Tests
    # A called workflow cannot exceed what the calling job grants, so the checkout in tests.yml needs this.
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  build-n-publish:
    name: Build and publish Python distribution to PyPI
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/instagram-monitor/
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.x"
    - name: Install build
      run: python3 -m pip install build --user
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
